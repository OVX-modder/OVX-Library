name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: gradle clean jar

      - name: Convert to Android DEX
        run: |
          set -euo pipefail

          echo "Checking build artifacts..."
          ls -la build || true
          ls -la build/libs || true

          if [ ! -f build/libs/ovx-library.jar ]; then
            echo "ERROR: build/libs/ovx-library.jar was not generated."
            exit 1
          fi

          wget -q https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip -q dex-tools-v2.4.zip
          chmod +x dex-tools-v2.4/*.sh

          # Convert the jar to dex, but do not assume the output name
          ./dex-tools-v2.4/d2j-jar2dex.sh -o build/libs/ovx-library-dex.jar build/libs/ovx-library.jar || {
            echo "DEX conversion failed; checking what was produced..."
            find build -maxdepth 3 -type f | sort
            exit 1
          }

          # If the tool created a different file name, move it into place
          if [ -f build/libs/ovx-library-dex.jar ]; then
            mv build/libs/ovx-library-dex.jar build/libs/ovx-library.jar
          else
            echo "ERROR: Expected dex output was not created."
            find build -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: ovx-library
          path: build/libs/ovx-library.jar
